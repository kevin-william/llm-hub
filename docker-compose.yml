services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llmhub}
      POSTGRES_USER: ${POSTGRES_USER:-llmhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  minio:
    # The upstream minio/minio Docker Hub repository was removed in 2026.
    # alpine/minio remains API-compatible and supports the same server command.
    image: alpine/minio:latest-release
    # This image runs as the `minio` user by default, while Docker Desktop
    # creates the named volume as root. Run the local development service as
    # root so it can initialize its data directory.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-llmhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
